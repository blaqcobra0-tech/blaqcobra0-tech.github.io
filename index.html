<!doctype html>
<!--
  ============================================================================
  SHARON'S SIGNATURE — Nail Salon & Training Studio, Wuye, Abuja
  ============================================================================
  CONTENT TO CONFIRM (placeholders deliberately left in place, all easy to swap):
   1. Prices            -> "From ₦XX,000" placeholders in src/data/site.ts
   2. Opening hours     -> "Hours to be confirmed" in src/data/site.ts
   3. Bio / story copy  -> marked "placeholder copy" in src/data/site.ts
   4. Course details    -> level / duration / price "to be confirmed"
   5. Review wording    -> use the exact Google review text
   6. Certificate photos-> /images/cert-1..4 (placeholder certificates supplied)
   7. Hero + training video files -> /assets/hero-nails.mp4, /assets/training-demo.mp4
   8. Analytics domain  -> Plausible `data-domain` below
   9. Map coordinates   -> "geo" in the JSON-LD below
  ============================================================================
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sharon's Signature | Nail Salon &amp; Russian Manicure in Wuye, Abuja</title>
    <meta
      name="description"
      content="Luxury nail salon in Wuye, Abuja offering Russian manicure, Hard Gel, BIAB, Gel X and Poly Gel. 4.9★ rated. Book on WhatsApp. Nail training available."
    />

    <meta name="author" content="Sharon's Signature" />
    <link rel="canonical" href="https://sharonssignature.com/" />

    <!-- Open Graph / Twitter -->

    <meta
      name="twitter:description"
      content="Russian-style manicures, Hard Gel, BIAB and Gel X, crafted with precision and care. 4.9★ from 38 Google reviews. Book on WhatsApp."
    />
    <meta name="twitter:image" content="https://sharonssignature.com/images/hero-1200.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
